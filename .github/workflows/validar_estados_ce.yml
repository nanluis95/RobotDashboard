
name: Validar Estados CE

on:
  workflow_dispatch:
    inputs:
      site_ids_json:
        description: "Lista JSON de SITE ID para consultar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validar-estados-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Ejecutar consulta de Estados CE
        env:
          SITE_IDS_JSON: ${{ inputs.site_ids_json }}
          IMASTER_USER: ${{ secrets.IMASTER_USER }}
          IMASTER_PASSWORD: ${{ secrets.IMASTER_PASSWORD }}
          REPORTE_CE_API_KEY: ${{ secrets.REPORTE_CE_API_KEY }}
        run: python "API ESTADOS CE.py"
